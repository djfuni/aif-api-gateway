# Optional Nginx hardening snippet for app_api.php
# Place inside your server {} block and adjust PHP-FPM socket/path for your host.

location = /app_api.php {
    limit_except GET POST OPTIONS { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/app_api.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
}

location ~* ^/data/ {
    deny all;
}
